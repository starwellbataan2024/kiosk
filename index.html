<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Clock</title>
<style>
*{box-sizing:border-box}
:root{--fg:#f6efe8;--cd:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--ac:#f3e3d0;--acf:#2a1c12;--ib:rgba(0,0,0,.35)}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg);display:flex;justify-content:center;padding:8px 10px 44px;min-height:100vh;background-attachment:fixed;background-size:cover;background-position:center}
#dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:0}
.wrap{width:100%;max-width:1500px;text-align:center;position:relative;z-index:1}
.shop{font-size:calc(clamp(22px,4vw,36px)*var(--fs,1));font-weight:800;letter-spacing:.02em}
.clk{font-size:calc(clamp(34px,6vw,52px)*var(--fs,1));font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.dt{opacity:.75;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 4px 8px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;text-align:left}#logo{height:calc(56px*var(--fs,1));max-width:40vw;object-fit:contain}.tm{text-align:right}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:12px;backdrop-filter:blur(8px)}
.cam{position:relative;width:100%;height:calc((100vh - 150px)*var(--ch,1));min-height:260px;margin:0 auto;background:#000;border-radius:18px;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:var(--fit,contain);transform:scaleX(-1)}
.frame{position:absolute;left:60%;top:40%;width:30%;height:40%;border:4px solid var(--ac);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}
.fhint{position:absolute;left:0;right:0;top:10px;font-size:calc(15px*var(--fs,1));color:#fff;text-shadow:0 1px 4px #000}
.msg{margin:10px 4px 4px;min-height:1.6em;font-size:calc(18px*var(--fs,1))}
.msg.bad{color:#ff8a7a}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
input,select,textarea{flex:1;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--ib);color:var(--fg);min-width:0}
textarea{width:100%}
input[type=color]{padding:2px;height:44px;flex:none;width:64px}
input[type=range]{padding:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--ac);color:var(--acf);font-weight:600}
button.g{background:var(--cd);color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.4}
.hi{font-size:calc(28px*var(--fs,1));font-weight:700}
.nx{font-size:calc(20px*var(--fs,1));opacity:.85;margin:4px 0 10px}
.dots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--fg)}
.dots i.on{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:10px auto}
.pad button{font-size:calc(26px*var(--fs,1));padding:16px 0;background:var(--cd);color:var(--fg);border:1px solid var(--bd)}
.res{padding:26px 8px}.res .ic{font-size:calc(64px*var(--fs,1))}
.big{font-size:calc(30px*var(--fs,1));font-weight:700}.big2{font-size:calc(22px*var(--fs,1));opacity:.9;margin-top:4px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:13px;display:flex;justify-content:space-between;gap:16px;z-index:2}
.foot a{color:var(--fg);opacity:.7;cursor:pointer;text-decoration:underline}
.ok{color:#2fae63}.bd{color:#e5584c}
#set{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:5}
#set .p{width:100%;max-width:520px;background:var(--b2,#17110d);color:var(--fg);border:1px solid var(--bd);border-radius:20px;padding:16px;text-align:left}
#set h3{margin:0 0 10px}#set label{display:block;font-size:13px;opacity:.8;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:8px 14px}.chips button.on{outline:3px solid var(--fg)}
</style>
</head>
<body>
<div id="dim"></div>
<div class="wrap">
  <div class="top"><div class="brand"><img id="logo" alt="" style="display:none"><div class="shop" id="shop"></div></div><div class="tm"><div class="clk" id="clk">--:--</div><div class="dt" id="dt"></div></div></div>
  <div class="card" id="box"></div>
</div>
<div id="set"></div>
<div class="foot"><span><a onclick="fs()">&#x26F6; Full screen</a></span><span id="st"></span><a onclick="openSet()">&#9881; Settings</a></div>

<script>
/* ============ BrewCost Kiosk (live camera) ============ */
const LIB1='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',LIB2='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CFG=null,INFO={photo:1,manual:false,shop:'',tz:'Asia/Manila'},S={stream:null,mode:'scan',busy:0,code:'',who:null,pin:'',snap:'',to:0,sc:0,camBad:0,cv:null};

/* ---------- storage / setup ---------- */
function loadCfg(){try{CFG=JSON.parse(localStorage.getItem('bc_kiosk')||'null')}catch(e){CFG=null}return CFG&&CFG.u&&CFG.k}
function setupScreen(msg){
  stopAll();
  $('#box').innerHTML=`<div class="hi" style="font-size:22px">Kiosk setup</div><div class="msg ${msg?'bad':''}">${esc(msg||'Paste the setup code from BrewCost: Payroll > Time clock > Kiosk.')}</div><textarea id="code" rows="4" placeholder="Setup code"></textarea><div class="row"><button onclick="saveSetup()" style="flex:1">Save</button>${loadCfg()?'<button class="g" onclick="start()">Cancel</button>':''}</div>`;
}
async function saveSetup(){
  try{const o=JSON.parse(atob($('#code').value.trim()));if(!o.u||!o.k)throw 0;
    if(!/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[^\/]+\/exec$/.test(o.u))throw new Error('The web app link in this code is not a published /exec link. Deploy the app as a Web app, open Show setup code again.');
    localStorage.setItem('bc_kiosk',JSON.stringify(o));start()}
  catch(e){setupScreen(e&&e.message?e.message:'That setup code is not valid.')}
}

/* ---------- server calls ---------- */
async function api(fn,args){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),30000);
  try{const r=await fetch(CFG.u,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.k,fn:fn},args||{})),redirect:'follow',signal:ac.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');return j.r}
  catch(e){if(e.name==='AbortError')throw new Error('The server took too long. Check the internet and try again.');
    if(e instanceof TypeError)throw new Error('Cannot reach the server. Check the internet. If this keeps happening, the app must be deployed with access "Anyone".');
    throw e}
  finally{clearTimeout(t)}
}

/* ---------- clock ---------- */
function tick(){const n=new Date(),o={timeZone:INFO.tz||undefined};
  try{$('#clk').textContent=n.toLocaleTimeString('en-PH',Object.assign({hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true},o));
      $('#dt').textContent=n.toLocaleDateString('en-PH',Object.assign({weekday:'long',year:'numeric',month:'long',day:'numeric'},o))}catch(e){}}
setInterval(tick,1000);tick();
const t12=h=>{const m=/^(\d{1,2}):(\d{2})/.exec(h||'');if(!m)return h||'';let H=+m[1];const ap=H>=12?'PM':'AM';H=H%12||12;return H+':'+m[2]+' '+ap};

/* ---------- camera ---------- */
function stopAll(){clearInterval(S.sc);clearTimeout(S.to);S.sc=0;if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
async function openCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('NoApi');
  const tries=[{video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false},{video:{facingMode:'user'},audio:false},{video:true,audio:false}];
  let last;for(const c of tries){try{return await navigator.mediaDevices.getUserMedia(c)}catch(e){last=e;if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'||e.name==='NotFoundError'))break}}
  throw last;
}
function camErr(e){const n=(e&&e.name)||'',m=String((e&&e.message)||e||'');
  if(m==='NoApi')return 'This browser cannot open the camera. Use Chrome or Safari and open this page with https://.';
  if(n==='NotAllowedError'||n==='SecurityError')return 'Camera is blocked. Tap the lock icon in the address bar, set Camera to Allow, then tap Try again.';
  if(n==='NotFoundError')return 'No camera was found on this device.';
  if(n==='NotReadableError'||n==='AbortError')return 'The camera is used by another app or tab. Close it, then tap Try again.';
  return 'Camera error: '+m.replace(/\.$/,'')+'.'}
function needLib(){return window.jsQR?Promise.resolve():new Promise((ok,no)=>{const L=u=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>u===LIB1?L(LIB2):no(new Error('QR reader could not load'));document.head.appendChild(s)};L(LIB1)})}
async function startCam(){
  const bad=e=>{S.camBad=1;const m=$('#m');if(m){m.className='msg bad';m.innerHTML=esc(camErr(e))+'<div class="row" style="justify-content:center"><button onclick="startCam()">Try again</button></div>'+(INFO.manual?'<div style="font-size:13px;opacity:.8;margin-top:6px">Or type your employee number below.</div>':'')}};
  try{if(!S.stream)S.stream=await openCam();if(S.mode==='scan'||S.mode==='pin')attach();S.camBad=0;const m=$('#m');if(m&&S.mode==='scan'){m.className='msg';m.textContent='Hold your QR card next to your face'}}
  catch(e){bad(e);return}
  try{await needLib();clearInterval(S.sc);S.sc=setInterval(loop,280)}
  catch(e){const m=$('#m');if(m){m.className='msg bad';m.textContent='Camera is on, but the QR reader could not load. Check the internet.'}}
}
function attach(){const v=$('#v');if(v&&S.stream&&v.srcObject!==S.stream){v.srcObject=S.stream;v.play&&v.play().catch(()=>{})}
  if(v){v.onloadedmetadata=v.onresize=v.onplaying=fitFrame}fitFrame()}
/* put the QR square on the part of the camera picture that is really visible (works for "whole picture" and "zoomed") */
let CQ=32,CF='contain';
function fitFrame(){const b=$('.cam'),v=$('#v'),f=$('.frame');if(!b||!v||!f)return;
  const cw=b.clientWidth,ch=b.clientHeight,vw=v.videoWidth,vh=v.videoHeight;if(!cw||!ch)return;
  let x0=0,y0=0,x1=cw,y1=ch;
  if(vw&&vh){const k=CF==='cover'?Math.max(cw/vw,ch/vh):Math.min(cw/vw,ch/vh),dw=vw*k,dh=vh*k,l=(cw-dw)/2,t=(ch-dh)/2;x0=Math.max(0,l);y0=Math.max(0,t);x1=Math.min(cw,l+dw);y1=Math.min(ch,t+dh)}
  const w=x1-x0,h=y1-y0,sz=Math.max(40,Math.min(w,h)*CQ/100*1.7);
  f.style.width=f.style.height=sz+'px';f.style.left=(x1-sz-w*.04)+'px';f.style.top=(y1-sz-h*.06)+'px'}
addEventListener('resize',fitFrame);
function grab(w){const v=$('#v');if(!S.stream||!v||!v.videoWidth)return '';const c=document.createElement('canvas');c.width=w;c.height=Math.round(v.videoHeight*w/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
/* ONE picture: the frame where the QR is read (face + QR together) is the punch photo. */
function loop(){
  if(S.mode!=='scan'||S.busy||!window.jsQR)return;const v=$('#v');if(!v||!v.videoWidth)return;
  const w=480,h=Math.round(v.videoHeight*w/v.videoWidth),c=S.cv||(S.cv=document.createElement('canvas'));c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
  const r=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
  if(r&&/^BC1\|/.test(r.data)){S.snap=c.toDataURL('image/jpeg',.6);who(r.data)}
}
async function fromFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f||S.busy)return;
  try{await needLib();
    const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('Could not read the picture.'));i.src=u});
    const W=Math.min(1000,img.naturalWidth),H=Math.round(img.naturalHeight*W/img.naturalWidth),c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,W,H);
    const r=jsQR(x.getImageData(0,0,W,H).data,W,H,{inversionAttempts:'attemptBoth'});
    if(!r||!/^BC1\|/.test(r.data)){scan('QR not found. Hold the card near your face and try again.',true);return}
    const q=document.createElement('canvas');q.width=640;q.height=Math.round(H*640/W);q.getContext('2d').drawImage(c,0,0,q.width,q.height);
    S.snap=q.toDataURL('image/jpeg',.6);who(r.data)
  }catch(e){scan(e.message||String(e),true)}
}

/* ---------- screens ---------- */
function scan(msg,bad){
  S.mode='scan';S.busy=0;S.code='';S.who=null;S.pin='';S.snap='';
  $('#box').innerHTML=`<div class="cam"><video id="v" playsinline muted autoplay></video><div class="frame"></div><div class="fhint">Show your face and QR card together</div></div><input type="file" id="f" accept="image/*" capture="user" hidden onchange="fromFile(this)"><div id="m" class="msg ${bad?'bad':''}">${esc(msg||(S.stream?'Hold your QR card next to your face':'Starting camera...'))}</div>${S.camBad?'<div class="row" style="justify-content:center"><button onclick="document.getElementById(\'f\').click()">Take photo with QR</button></div>':''}${INFO.manual?`<div class="row"><input id="en" placeholder="Employee no." autocomplete="off" onkeydown="if(event.key==='Enter')who(this.value.trim())"><button onclick="who(document.getElementById('en').value.trim())">Go</button></div>`:''}`;
  attach();
}
async function who(code){
  if(S.busy||!code)return;S.busy=1;if(!S.snap)S.snap=grab(480);
  try{const w=await api('clockWho',{code:code});
    if(w.done){back('You already finished all 4 punches today, '+w.Name+'.',false,3500);return}
    S.code=code;S.who=w;S.pin='';S.mode='pin';S.busy=0;pinUI()}
  catch(e){if(/Kiosk key is not valid|not set up/.test(e.message)){setupScreen(e.message);return}back(e.message||String(e),true,3500)}
}
function back(msg,bad,ms){S.busy=1;S.mode='wait';$('#box').innerHTML=`<div class="res"><div class="ic ${bad?'bd':''}">${bad?'&#10060;':'&#8505;&#65039;'}</div><div class="big" style="font-size:22px">${esc(msg)}</div></div>`;clearTimeout(S.to);S.to=setTimeout(()=>scan(),ms||3000)}
function pinUI(msg){
  const w=S.who,d='<i class="on"></i>'.repeat(S.pin.length)+'<i></i>'.repeat(Math.max(0,4-S.pin.length));
  $('#box').innerHTML=`<div class="hi">Hi, ${esc(w.Name)}!</div><div class="nx">${esc(w.label)}</div><div class="dots">${d}</div><div class="msg bad">${esc(msg||'')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'C',0,'DEL'].map(k=>`<button type="button" onclick="key('${k}')">${k==='DEL'?'&#9003;':k}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="g" onclick="scan()">Cancel</button><button onclick="submit()" ${S.pin.length<4?'disabled':''} style="padding:12px 40px">OK</button></div>`;
}
function key(k){if(S.mode!=='pin'||S.busy)return;if(k==='C')S.pin='';else if(k==='DEL')S.pin=S.pin.slice(0,-1);else if(S.pin.length<6)S.pin+=k;pinUI()}
addEventListener('keydown',e=>{if(S.mode!=='pin'||S.busy)return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('DEL');else if(e.key==='Enter'&&S.pin.length>=4)submit()});
async function submit(){
  if(S.busy||S.pin.length<4)return;S.busy=1;const photo=INFO.photo>0?S.snap:'';
  try{const r=await api('clockPunch',{code:S.code,pin:S.pin,photo:photo});S.mode='wait';
    $('#box').innerHTML=`<div class="res"><div class="ic ok">&#9989;</div><div class="big">${esc(r.Name)}</div><div class="big2">${esc(r.label)} &middot; ${esc(t12(r.time))}</div>${r.last?'<div class="msg">Thank you, see you tomorrow!</div>':''}${r.photo?'':'<div class="msg" style="font-size:14px;opacity:.7">No photo was saved.</div>'}</div>`;
    clearTimeout(S.to);S.to=setTimeout(()=>scan(),3500)}
  catch(e){const m=e.message||String(e);if(/Wrong PIN/.test(m)&&!/Locked/.test(m)){S.busy=0;S.pin='';pinUI(m)}else back(m,true,3500)}
}

/* ---------- start ---------- */
async function start(){
  stopAll();
  if(!loadCfg()){setupScreen();return}
  $('#box').innerHTML='<div class="msg">Connecting...</div>';
  try{INFO=Object.assign(INFO,await api('clockInfo'));applyUI();$('#st').textContent=''}
  catch(e){if(/Kiosk key is not valid|not set up/.test(e.message)){setupScreen(e.message);return}
    $('#box').innerHTML=`<div class="msg bad">${esc(e.message)}</div><div class="row" style="justify-content:center"><button onclick="start()">Try again</button></div>`;return}
  scan();
  startCam();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}if(S.mode==='scan'&&S.stream&&!S.stream.active)startCam()}});

/* ---------- look & settings (saved on this tablet only) ---------- */
const TH={coffee:['Coffee',{b1:'#3b2a1f',b2:'#17110d',fg:'#f6efe8',cd:'rgba(255,255,255,.07)',bd:'rgba(255,255,255,.14)',ac:'#f3e3d0',acf:'#2a1c12',ib:'rgba(0,0,0,.35)'}],
midnight:['Midnight',{b1:'#1e2a4a',b2:'#070b17',fg:'#eef2ff',cd:'rgba(255,255,255,.07)',bd:'rgba(255,255,255,.14)',ac:'#8fb4ff',acf:'#07122b',ib:'rgba(0,0,0,.35)'}],
ocean:['Ocean',{b1:'#0f5c6b',b2:'#06222a',fg:'#e8fbff',cd:'rgba(255,255,255,.08)',bd:'rgba(255,255,255,.16)',ac:'#7ae0ee',acf:'#042a31',ib:'rgba(0,0,0,.3)'}],
forest:['Forest',{b1:'#1f5a3a',b2:'#0a2216',fg:'#eefaf1',cd:'rgba(255,255,255,.08)',bd:'rgba(255,255,255,.16)',ac:'#9be8b6',acf:'#08301a',ib:'rgba(0,0,0,.3)'}],
rose:['Rose',{b1:'#7a2c47',b2:'#2a0d19',fg:'#fff0f5',cd:'rgba(255,255,255,.08)',bd:'rgba(255,255,255,.16)',ac:'#ffc2d6',acf:'#4a1127',ib:'rgba(0,0,0,.3)'}],
light:['Light',{b1:'#fff7ee',b2:'#e9dccb',fg:'#2a1c12',cd:'rgba(255,255,255,.75)',bd:'rgba(0,0,0,.12)',ac:'#3b2a1f',acf:'#ffffff',ib:'rgba(255,255,255,.95)'}]};
const UI0={name:'',theme:'coffee',accent:'',bg:'theme',bgColor:'#222222',bgImg:'',dim:30,lock:'',logo:'',fs:100,fit:'contain',camh:100,qs:32};
let UI=Object.assign({},UI0);try{UI=Object.assign({},UI0,JSON.parse(localStorage.getItem('bc_ui')||'{}'))}catch(e){}
function applyUI(u){u=u||UI;const t=(TH[u.theme]||TH.coffee)[1],r=document.documentElement.style;
  for(const k of ['fg','cd','bd','ac','acf','ib','b2'])r.setProperty('--'+k,t[k]);
  if(u.accent)r.setProperty('--ac',u.accent);
  const b=document.body.style;
  if(u.bg==='image'&&u.bgImg){b.background='url('+u.bgImg+') center/cover fixed'}
  else if(u.bg==='color'){b.background=u.bgColor}
  else b.background='radial-gradient(1200px 700px at 20% -10%,'+t.b1+' 0,'+t.b2+' 60%) fixed';
  CQ=u.qs||32;CF=u.fit||'contain';setTimeout(fitFrame,0);
  r.setProperty('--ch',(u.camh||100)/100);r.setProperty('--fit',u.fit||'contain');r.setProperty('--qs',u.qs||32);r.setProperty('--fs',(u.fs||100)/100);const lg=$('#logo');if(u.logo){lg.src=u.logo;lg.style.display=''}else{lg.removeAttribute('src');lg.style.display='none'}
  $('#dim').style.opacity=u.bg==='image'?(u.dim/100):0;
  const n=(u.name||INFO.shop||'').trim();$('#shop').textContent=n;document.title=(n?n+' - ':'')+'Time Clock'}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function fs(){const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()).catch(()=>{})}
let DR=null;
async function openSet(){
  if(UI.lock){const p=prompt('Settings PIN');if(p===null)return;if(await sha(p)!==UI.lock){alert('Wrong PIN');return}}
  DR=Object.assign({},UI);drawSet()}
function drawSet(){const d=DR;
  $('#set').style.display='flex';$('#set').innerHTML=`<div class="p"><h3>Kiosk settings</h3>
  <label>Shop name (leave empty to use the name from BrewCost)</label><input id="sn" value="${esc(d.name)}" placeholder="${esc(INFO.shop||'Shop name')}" oninput="DR.name=this.value;applyUI(DR)">
  <label>Company logo</label><div class="row" style="margin:0"><input type="file" accept="image/*" onchange="pickLogo(this)">${d.logo?'<button class="g" onclick="DR.logo=\'\';drawSet();applyUI(DR)">Remove</button>':''}</div>
  <label>Text size: ${d.fs||100}%</label><input type="range" min="80" max="160" step="5" value="${d.fs||100}" oninput="DR.fs=+this.value;applyUI(DR);this.previousElementSibling.textContent='Text size: '+this.value+'%'">
  <label>Camera view</label><select onchange="DR.fit=this.value;applyUI(DR)"><option value="contain" ${d.fit!=='cover'?'selected':''}>Show the whole picture (no zoom)</option><option value="cover" ${d.fit==='cover'?'selected':''}>Fill the box (zoomed in)</option></select>
  <label>Camera size: ${d.camh||100}%</label><input type="range" min="50" max="100" step="5" value="${d.camh||100}" oninput="DR.camh=+this.value;applyUI(DR);this.previousElementSibling.textContent='Camera size: '+this.value+'%'">
  <label>QR square size: ${d.qs||32}%</label><input type="range" min="12" max="45" step="1" value="${d.qs||32}" oninput="DR.qs=+this.value;applyUI(DR);this.previousElementSibling.textContent='QR square size: '+this.value+'%'">
  <div style="font-size:12px;opacity:.65;margin-top:4px">The square is only a guide. The QR is read from the whole camera picture.</div>
  <label>Theme</label><div class="chips">${Object.keys(TH).map(k=>`<button class="${d.theme===k?'on':'g'}" onclick="DR.theme='${k}';DR.accent='';drawSet();applyUI(DR)">${TH[k][0]}</button>`).join('')}</div>
  <label>Button / highlight colour</label><div class="row" style="margin:0"><input type="color" value="${d.accent||(TH[d.theme]||TH.coffee)[1].ac}" oninput="DR.accent=this.value;applyUI(DR)"><button class="g" onclick="DR.accent='';drawSet();applyUI(DR)">Use theme colour</button></div>
  <label>Background</label><select onchange="DR.bg=this.value;drawSet();applyUI(DR)"><option value="theme" ${d.bg==='theme'?'selected':''}>Theme colours</option><option value="color" ${d.bg==='color'?'selected':''}>One solid colour</option><option value="image" ${d.bg==='image'?'selected':''}>My picture</option></select>
  ${d.bg==='color'?`<div class="row"><input type="color" value="${d.bgColor}" oninput="DR.bgColor=this.value;applyUI(DR)"></div>`:''}
  ${d.bg==='image'?`<div class="row"><input type="file" accept="image/*" onchange="pickBg(this)"></div><label>Darken picture: ${d.dim}%</label><input type="range" min="0" max="80" value="${d.dim}" oninput="DR.dim=+this.value;applyUI(DR);this.previousElementSibling.textContent='Darken picture: '+this.value+'%'">`:''}
  <label>Settings PIN (optional, stops employees from opening this panel)</label><div class="row" style="margin:0"><input id="sp" inputmode="numeric" maxlength="6" placeholder="${d.lock?'PIN is set. Type a new one to change':'4 to 6 digits'}">${d.lock?'<button class="g" onclick="rmLock()">Remove PIN</button>':''}</div>
  <div class="row" style="margin-top:16px"><button style="flex:1" onclick="saveSet()">Save</button><button class="g" onclick="closeSet(1)">Cancel</button></div>
  <div class="row"><button class="g" style="flex:1" onclick="DR=Object.assign({},UI0,{lock:DR.lock});drawSet();applyUI(DR)">Reset look</button><button class="g" style="flex:1" onclick="closeSet(1);setupScreen()">Change setup code</button></div></div>`}
function pickLogo(inp){const f=inp.files&&inp.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{const k=Math.min(1,360/i.naturalHeight,720/i.naturalWidth),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);DR.logo=c.toDataURL('image/png');applyUI(DR);drawSet()};i.src=u}
function rmLock(){DR.lock='';drawSet()}
function pickBg(inp){const f=inp.files&&inp.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{const w=Math.min(1280,i.naturalWidth),c=document.createElement('canvas');c.width=w;c.height=Math.round(i.naturalHeight*w/i.naturalWidth);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);DR.bgImg=c.toDataURL('image/jpeg',.72);applyUI(DR)};i.src=u}
async function saveSet(){const p=($('#sp')||{}).value||'';if(p){if(!/^\d{4,6}$/.test(p)){alert('PIN must be 4 to 6 digits');return}DR.lock=await sha(p)}
  try{localStorage.setItem('bc_ui',JSON.stringify(DR))}catch(e){alert('The picture is too big to save. Choose a smaller picture.');return}
  UI=DR;closeSet()}
function closeSet(revert){$('#set').style.display='none';$('#set').innerHTML='';if(revert)applyUI(UI)}
applyUI();
start();
</script>
</body>
</html>
